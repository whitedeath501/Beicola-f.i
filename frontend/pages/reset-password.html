<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Beiçola F.I.</title><link rel="stylesheet" href="/css/style.css"></head><body><main><section class="card"><h1>Nova senha</h1><form id="f"><input id="p" type="password" placeholder="Nova senha (8+ caracteres)" required><input id="p2" type="password" placeholder="Repita a senha" required><button>Salvar nova senha</button></form><p id="m"></p></section></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('p').value,b=document.getElementById('p2').value;if(a!==b)return document.getElementById('m').textContent='As senhas não coincidem.';const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:a})});const j=await r.json();document.getElementById('m').textContent=j.message||j.error||'Concluído.';};</script></body></html>
